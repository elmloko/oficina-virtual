# Oficina virtual en Docker usando los modelos locales de tu PC.
#   docker compose up -d --build      → http://localhost:4000
# Requisitos en Windows: Docker Desktop abierto, y Ollama y/o LM Studio (servidor local activo) en el PC.
services:
  oficina:
    build: .
    container_name: oficina-virtual
    restart: "no" # no arranca sola: al encender el PC la oficina se inicia en local (iniciar-oficina-oculto.vbs)
    ports:
      - "127.0.0.1:${OFICINA_PORT:-4000}:4000"   # solo accesible desde tu PC, nunca desde la red
    extra_hosts:
      - "host.docker.internal:host-gateway"      # nombre del PC visto desde el contenedor
    # Las claves NO se pasan como variables (se verían con `docker inspect`): viven en /app/data/.env del volumen.
    # Para llevar las del PC: docker cp .env oficina-virtual:/app/data/.env && docker compose restart
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      # Modelos locales del PC (no se copian: el contenedor les habla por la red)
      OLLAMA_URL: http://host.docker.internal:11434
      LMSTUDIO_URL: http://host.docker.internal:1234/v1
      # Rutas dentro del contenedor (las de Windows del .env no valen aquí)
      HTDOCS_ROOT: /htdocs
      DOCS_ROOT: /documentos
      EXTRA_ROOTS: Descargas=/descargas;Disco_C=/disco_c   # Disco_C = todo C: de tu PC, solo lectura
      AGENTS_DIR: /agents
      AGENT_SOURCES: Proyectos=/htdocs
      ENV_FILE: /app/data/.env                    # las claves que guardes desde la web quedan en ./data/.env de TU PC
    volumes:
      - ./data:/app/data                          # carpeta ./data de tu PC: misiones (oficina.db), claves (.env), copias de trabajo y adjuntos
      - C:/:/disco_c:ro                           # todo el disco C: de tu PC, solo lectura
      - ${HTDOCS_HOST:-C:/xampp/htdocs}:/htdocs
      - ${DOCS_HOST:-${USERPROFILE}/OneDrive/Documentos}:/documentos
      - ${USERPROFILE}/Downloads:/descargas:ro
      - ${USERPROFILE}/.claude/agents:/agents     # escritura: «Importar agentes» guarda aquí (nunca pisa uno existente)
      - claude-home:/home/node/.claude            # sesión propia de Claude Code en Docker (se inicia una vez, ver README)
      # Código de la oficina EN VIVO (solo lectura): public/ se ve al recargar la página;
      # server/ reinicia el servidor solo (server/watch-poll.js). Sin --build tras cada cambio.
      - ./server:/app/server:ro
      - ./public:/app/public:ro
    command: ["node", "server/watch-poll.js"]

volumes:
  claude-home:
